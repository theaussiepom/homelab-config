http:
  routers:

    drive:
      entryPoints:
        - https
      service: drive
      rule: (Host(`drive.{{env "DOMAIN"}}`) || Host(`drive.{{env "DOMAIN_ALIAS"}}`)) && HeaderRegexp(`CF-Connecting-IP`, `.*`)
      tls:
        certresolver: cloudflare
      middlewares:
        - cloudflare@file
        - cloudflare-header@file
        - securityHeadersUnsafe@file

    drive-local:
      entryPoints:
        - https
      service: drive
      rule: (Host(`drive.{{env "DOMAIN"}}`) || Host(`drive.{{env "DOMAIN_ALIAS"}}`))
      tls:
        certresolver: cloudflare
      middlewares:
        - local@file
        - securityHeadersUnsafeEval@file

  services:
    drive:
      loadBalancer:
        servers:
          - url: http://{{env "HOME_NETWORK_PREFIX"}}.2:31767/