http:
  routers:
    zwave-js-ui:
      entryPoints:
        - https
      service: zwave-js-ui
      rule: (Host(`zwave.{{env "DOMAIN"}}`) || Host(`zwave.{{env "DOMAIN_ALIAS"}}`))
      tls:
        certresolver: cloudflare
      middlewares:
        - chain-lan-forwardauth-unsafe@file

  services:
    zwave-js-ui:
      loadBalancer:
        servers:
          - url: http://zwave-js-ui.underground:8091/