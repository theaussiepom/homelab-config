http:
  routers:
    thread:
      entryPoints:
        - https
      service: thread
      rule: (Host(`thread.{{env "DOMAIN"}}`) || Host(`thread.{{env "DOMAIN_ALIAS"}}`))
      tls:
        certresolver: cloudflare
      middlewares:
        - chain-lan-unsafe@file

  services:
    thread:
      loadBalancer:
        servers:
          - url: http://{{env "HOME_NETWORK_PREFIX"}}.240:7586/