http:
  routers:

    driveServer:
      entryPoints:
        - https
      service: driveServer
      rule: (Host(`driveserver.{{env "DOMAIN"}}`) || Host(`driveserver.{{env "DOMAIN_ALIAS"}}`)) && HeaderRegexp(`CF-Connecting-IP`, `.*`)
      tls:
        certresolver: cloudflare
      middlewares:
        - chain-public-cf-strict@file

    driveServer-local:
      entryPoints:
        - https
      service: driveServer
      rule: (Host(`driveserver.{{env "DOMAIN"}}`) || Host(`driveserver.{{env "DOMAIN_ALIAS"}}`))
      tls:
        certresolver: cloudflare
      middlewares:
        - chain-lan-strict@file

  services:
    driveServer:
      loadBalancer:
        servers:
          - url: http://{{env "HOME_NETWORK_PREFIX"}}.2:6690/