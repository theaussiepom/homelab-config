http:
  middlewares:
    securityHeaders:
      headers:
        customresponseheaders:
          Server: '{{env "DOMAIN"}}'
          X-Powered-By: '{{env "DOMAIN"}}'
        accesscontrolallowmethods: GET,POST
        accesscontrolmaxage: 100
        accesscontrolalloworiginlist: "*"
        addvaryheader: true
        contentSecurityPolicy: child-src 'self'; frame-ancestors 'self'; script-src 'self'; style-src 'self';
        contenttypenosniff: true
        referrerpolicy: origin-when-cross-origin
        sslredirect: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
