http:
  middlewares:
    securityHeadersBitwarden:
      headers:
        customresponseheaders:
          Server: '{{env "DOMAIN"}}'
          X-Powered-By: '{{env "DOMAIN"}}'
        accesscontrolallowmethods: GET,POST
        accesscontrolmaxage: 100
        accesscontrolalloworiginlist: "*"
        addvaryheader: true
        contentSecurityPolicy: |
          default-src 'self'; script-src 'self' https://*.stripe.com; connect-src 'self' https://{{env "DOMAIN"}} https://api.bitwarden.com https://identity.bitwarden.com https://*.stripe.com; frame-src 'self' https://*.stripe.com; child-src 'self'; frame-ancestors 'self'; style-src 'self' 'unsafe-inline';
        contenttypenosniff: true
        referrerpolicy: origin-when-cross-origin
        sslredirect: true
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
