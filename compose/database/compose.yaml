    image: sha256:24a90047f2d2b1d91a7ebe78270bf2559731017ae18484104a4bfd8ed7e4f23b
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      db_authentik: null
      db_postgresql: null
      db_zabbix: null
    pull_policy: never
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: false
        read_only: false
        source: /var/lib/databases/postgresql
        target: /var/lib/postgresql/data
        type: bind
volumes:
  docker:
    external: true
    name: docker
